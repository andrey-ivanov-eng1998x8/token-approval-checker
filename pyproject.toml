[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "token-approval-checker"
version = "0.2.0"
description = "Scan EVM wallets for active ERC-20 allowances directly over JSON-RPC"
authors = [{ name = "Alex", email = "alex.k@protonmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
token-approval-checker = "token_approval_checker.cli:main"
tac = "token_approval_checker.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
